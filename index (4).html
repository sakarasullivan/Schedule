<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Otter House Wellness — Daily Schedule</title>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --teal: #1e9e74; --teal-dim: rgba(30,158,116,0.1); --teal-mid: rgba(30,158,116,0.3); --teal-glow: rgba(30,158,116,0.15);
    --purple: #6b4fd8; --purple-dim: rgba(107,79,216,0.1); --purple-mid: rgba(107,79,216,0.3); --purple-glow: rgba(107,79,216,0.15);
    --amber: #c47d0e; --amber-dim: rgba(196,125,14,0.1); --amber-mid: rgba(196,125,14,0.3);
    --green: #2a9d5c; --green-dim: rgba(42,157,92,0.1); --green-mid: rgba(42,157,92,0.3);
    --red: #d95f5f; --red-dim: rgba(217,95,95,0.1);
    --bg: #e8ecf2; --surface: #ffffff; --surface2: #f2f4f8;
    --border: rgba(0,0,0,0.1); --border2: rgba(0,0,0,0.18);
    --text: #000000; --text-muted: #2a2a2a; --text-dim: #5a5a5a;
  }

  /* TV-optimised: designed for 1080p/4K horizontal display */
  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 18px; line-height: 1.5; overflow: hidden; }

  .root { position: relative; z-index: 1; height: 100vh; display: grid; grid-template-rows: auto 1fr; padding: 28px 36px 24px; gap: 0; }

  /* HEADER */
  header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 20px; border-bottom: 1px solid var(--border2); margin-bottom: 20px; }
  .logo-block { display: flex; align-items: center; gap: 16px; }
  .logo-mark { width: 52px; height: 52px; border-radius: 13px; background: var(--teal-dim); border: 1px solid var(--teal-mid); display: flex; align-items: center; justify-content: center; font-size: 26px; }
  .org-name { font-size: 26px; font-weight: 500; letter-spacing: -0.01em; }
  .org-sub { font-size: 14px; color: var(--text-muted); margin-top: 2px; letter-spacing: 0.02em; }
  .clock-block { text-align: right; }
  .clock { font-family: 'DM Mono', monospace; font-size: 52px; font-weight: 400; letter-spacing: 0.04em; line-height: 1; color: var(--text); }
  .date-str { font-size: 15px; color: var(--text-muted); margin-top: 5px; }

  /* MAIN GRID — schedule cols + wide right col */
  .main-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 340px;
    grid-template-rows: auto 1fr;
    gap: 16px;
    overflow: hidden;
    min-height: 0;
  }

  /* NOW PANEL — spans all 3 cols */
  .now-panel {
    grid-column: 1 / -1;
    background: var(--surface);
    border: 1px solid var(--border2);
    border-radius: 20px;
    padding: 0;
    display: grid;
    grid-template-columns: 1fr 1fr;
    overflow: hidden;
  }
  .now-track { padding: 18px 28px; position: relative; }
  .now-track.sacot-track { background: linear-gradient(135deg, rgba(30,158,116,0.07) 0%, transparent 70%); border-right: 1px solid var(--border2); }
  .now-track.saiop-track { background: linear-gradient(135deg, rgba(107,79,216,0.07) 0%, transparent 70%); }
  .now-eyebrow { font-size: 12px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.15em; color: var(--text-dim); margin-bottom: 8px; }
  .track-pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.12em; padding: 4px 14px; border-radius: 20px; margin-bottom: 10px; }
  .pill-sacot { background: var(--teal-dim); color: var(--teal); border: 1px solid var(--teal-mid); }
  .pill-saiop { background: var(--purple-dim); color: var(--purple); border: 1px solid var(--purple-mid); }
  .pill-done { background: var(--surface2); color: var(--text-dim); border: 1px solid var(--border); }
  .pill-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .now-activity { font-size: 28px; font-weight: 400; color: var(--text); line-height: 1.2; }
  .now-location { font-size: 15px; color: var(--text-muted); margin-top: 5px; }
  .now-next { font-size: 13px; color: var(--text-dim); margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); }

  /* SCHEDULE PANELS */
  .schedule-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 18px 20px;
    overflow: hidden;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }
  .sacot-panel { border-top: 3px solid var(--teal-mid); }
  .saiop-panel { border-top: 3px solid var(--purple-mid); }

  .panel-header { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; padding-bottom: 12px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
  .panel-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .sacot-panel .panel-dot { background: var(--teal); box-shadow: 0 0 8px var(--teal-glow); }
  .saiop-panel .panel-dot { background: var(--purple); box-shadow: 0 0 8px var(--purple-glow); }
  .ua-panel .panel-dot { background: var(--teal); }
  .cm-panel .panel-dot { background: var(--amber); }
  .np-panel .panel-dot { background: var(--green); }
  .panel-title { font-size: 14px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; }
  .sacot-panel .panel-title { color: var(--teal); }
  .saiop-panel .panel-title { color: var(--purple); }
  .ua-panel .panel-title { color: var(--teal); }
  .cm-panel .panel-title { color: var(--amber); }
  .np-panel .panel-title { color: var(--green); }
  .panel-sub { font-size: 13px; color: var(--text-dim); margin-left: auto; }

  .sched-list { flex: 1; overflow-y: auto; scrollbar-width: none; }
  .sched-list::-webkit-scrollbar { display: none; }

  .sched-row { display: flex; align-items: flex-start; gap: 12px; padding: 9px 11px; border-radius: 11px; margin-bottom: 3px; border-left: 3px solid transparent; }
  .sched-time { font-family: 'DM Mono', monospace; font-size: 13px; color: var(--text-muted); white-space: nowrap; min-width: 68px; padding-top: 2px; }
  .sched-body { flex: 1; }
  .sched-label { font-size: 16px; color: var(--text); line-height: 1.3; font-weight: 500; }
  .sched-location { font-size: 13px; color: var(--text-muted); margin-top: 2px; }

  .sacot-panel .sched-row.active { background: rgba(30,158,116,0.09); border-left-color: var(--teal); }
  .sacot-panel .sched-row.active .sched-time { color: var(--teal); font-weight: 500; }
  .sacot-panel .sched-row.active .sched-label { color: var(--teal); font-weight: 600; }
  .saiop-panel .sched-row.active { background: rgba(107,79,216,0.09); border-left-color: var(--purple); }
  .saiop-panel .sched-row.active .sched-time { color: var(--purple); font-weight: 500; }
  .saiop-panel .sched-row.active .sched-label { color: var(--purple); font-weight: 600; }
  .sched-row.past .sched-label { color: var(--text-dim); }
  .sched-row.past .sched-time { color: var(--text-dim); opacity: 0.4; }
  .sched-row.is-break .sched-label, .sched-row.is-done .sched-label { font-style: italic; color: var(--text-dim); font-size: 14px; }

  /* RIGHT COLUMN — UA + CM + NP stacked */
  .right-col {
    grid-column: 3;
    grid-row: 2 / 4;
    display: flex;
    flex-direction: column;
    gap: 16px;
    min-height: 0;
    overflow: hidden;
  }

  .ua-panel, .cm-panel, .np-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 18px 20px;
    display: flex;
    flex-direction: column;
  }

  /* UA gets more space, CM gets more space, NP is compact */
  .ua-panel { border-top: 3px solid var(--teal-mid); flex: 2; overflow: hidden; }
  .cm-panel { border-top: 3px solid var(--amber-mid); flex: 2; overflow: hidden; }
  .np-panel { border-top: 3px solid var(--green-mid); flex-shrink: 0; }

  /* UA bubbles — larger for TV */
  .ua-list { list-style: none; flex: 1; display: flex; flex-wrap: wrap; align-content: flex-start; gap: 12px; padding-top: 6px; overflow: hidden; }
  .ua-bubble { width: 78px; height: 78px; border-radius: 50%; background: var(--teal-dim); border: 2px solid var(--teal-mid); display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 0px; font-family: 'DM Mono', monospace; font-size: 12px; font-weight: 600; color: var(--teal); line-height: 1.4; text-align: center; }
  .ua-empty { font-size: 15px; color: var(--text-dim); padding-top: 8px; line-height: 1.6; }

  /* CM list — larger rows for TV */
  .cm-list { flex: 1; overflow-y: auto; scrollbar-width: none; padding-top: 6px; }
  .cm-list::-webkit-scrollbar { display: none; }
  .cm-row { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; margin-bottom: 6px; background: var(--amber-dim); border: 1px solid rgba(196,125,14,0.15); }
  .cm-initials { font-family: 'DM Mono', monospace; font-size: 15px; font-weight: 600; color: var(--amber); }
  .cm-empty { font-size: 15px; color: var(--text-dim); padding-top: 8px; font-style: italic; }

  /* NP status — no hours/time shown */
  .np-status { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
  .np-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
  .np-dot.yes { background: var(--green); box-shadow: 0 0 8px var(--green); animation: pulse 2.5s infinite; }
  .np-dot.no { background: var(--text-dim); }
  .np-label { font-size: 16px; color: var(--text); font-weight: 500; }

  /* Bottom row spacer */
  .bottom-spacer { grid-column: 1 / 3; grid-row: 3; display: none; }

  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

  .staff-link { position: fixed; bottom: 12px; right: 14px; font-size: 11px; color: var(--text-dim); text-decoration: none; opacity: 0.25; transition: opacity 0.2s; }
  .staff-link:hover { opacity: 1; }
</style>

// ─────────────────────────────────────────────
// UA DATA — keyed by date (YYYY-MM-DD)
// Format: "Fi. La." (first initial + last initial)
// Pulled from UA tracking sheet.
// Update each week by adding a new date entry.
// ─────────────────────────────────────────────
const DAILY_UA = {
  '2026-06-09': ["LE. PO.", "PE.", "MA. CH.", "JO. BI.", "JO. AL.", "JO. ME.", "ER. JO.", "CH. RA.", "BE. QU.", "JO. BU.", "MI. HU.", "MI. GE.", "JE. CO.", "CH. DO.", "KO. SO."],
};

// ─────────────────────────────────────────────
// UA — live from Google Sheet
// Sheet ID: 1_OyqFLxaEULAy7SFz69Gtjh1rsQRF1pubosaBPV9IOI
// Structure: each weekly block has columns:
//   Client Name (col 0), Scheduled Date of Test #1 (col 2),
//   Scheduled Date of Test #2 (col 4)
// We fetch the whole sheet as CSV and find rows where
// either test date matches today's date (M/D/YYYY).
// ─────────────────────────────────────────────
const UA_SHEET_ID = '1_OyqFLxaEULAy7SFz69Gtjh1rsQRF1pubosaBPV9IOI';

function toTwoLetterInitials(fullName) {
  // Strip parenthetical notes like "(PHP)", quotes, nicknames in quotes
  let name = fullName.replace(/\(.*?\)/g, '').replace(/"[^"]*"/g, '').trim();
  // Split on space
  const parts = name.split(/\s+/).filter(Boolean);
  if (parts.length === 0) return '';
  const first = parts[0].substring(0, 2).toUpperCase();
  const last = parts.length > 1 ? parts[parts.length - 1].substring(0, 2).toUpperCase() : '';
  return last ? `${first}. ${last}.` : `${first}.`;
}

function todayDateStrings() {
  const d = new Date();
  // Build M/D/YYYY and variants the sheet might use
  const m = d.getMonth() + 1;
  const day = d.getDate();
  const y = d.getFullYear();
  return [`${m}/${day}/${y}`, `${m}/${day}/${String(y).slice(2)}`];
}

async function fetchUAFromSheet() {
  const url = `https://docs.google.com/spreadsheets/d/${UA_SHEET_ID}/export?format=csv`;
  try {
    const res = await fetch(url);
    if (!res.ok) return [];
    const text = await res.text();
    const rows = parseCSV(text);
    const todayStrs = todayDateStrings();
    const found = new Set();
    const result = [];

    for (const row of rows) {
      const name = (row[0] || '').trim();
      if (!name || name.toLowerCase().includes('client name')) continue;

      // Check col 2 (Test #1 date) and col 4 (Test #2 date)
      const date1 = (row[2] || '').trim();
      const date2 = (row[4] || '').trim();

      const matchesToday = todayStrs.some(t =>
        date1.includes(t) || date2.includes(t)
      );

      if (matchesToday && !found.has(name)) {
        found.add(name);
        result.push({ initials: toTwoLetterInitials(name) });
      }
    }
    return result;
  } catch(e) {
    console.warn('UA sheet fetch failed:', e);
    return [];
  }
}

// ─────────────────────────────────────────────
// CASE MANAGER — live from Google Sheet
// Sheet: CM_Weekly_Schedule
// GIDs: Mon=522827791 Tue=1712064084 Wed=1837835834
//       Thu=1257780429 Fri=793441716
// Data rows start after the "Client" header row.
// Col A = initials, Col B = time, Col C = notes
// ─────────────────────────────────────────────
const CM_SHEET_ID = '1dFBl5c1CgaEAXmWKvUUygwx7BUd_EddBHAlGq0ny54A';
const DAY_GIDS = { 1: 522827791, 2: 1712064084, 3: 1837835834, 4: 1257780429, 5: 793441716 };

function parseCSV(text) {
  const rows = [];
  const lines = text.split(/\r?\n/);
  for (const line of lines) {
    if (!line.trim()) continue;
    const cols = [];
    let cur = '', inQ = false;
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (ch === '"') { inQ = !inQ; }
      else if (ch === ',' && !inQ) { cols.push(cur.trim()); cur = ''; }
      else { cur += ch; }
    }
    cols.push(cur.trim());
    rows.push(cols);
  }
  return rows;
}

async function fetchCMFromSheet() {
  const dow = new Date().getDay();
  const gid = DAY_GIDS[dow];
  if (!gid) return [];
  const url = `https://docs.google.com/spreadsheets/d/${CM_SHEET_ID}/export?format=csv&gid=${gid}`;
  try {
    const res = await fetch(url);
    if (!res.ok) return [];
    const text = await res.text();
    const rows = parseCSV(text);
    const entries = [];
    let dataStart = 7;
    for (let i = 0; i < rows.length; i++) {
      const first = (rows[i][0] || '').toLowerCase();
      if (first.includes('client')) { dataStart = i + 1; break; }
    }
    for (let i = dataStart; i < rows.length; i++) {
      const initials = (rows[i][0] || '').trim();
      const time     = (rows[i][1] || '').trim();
      if (!initials) continue;
      if (initials.toLowerCase().includes('client initials format')) break;
      if (initials.toLowerCase().includes('how to use')) break;
      entries.push({ initials, time });
    }
    return entries;
  } catch(e) {
    console.warn('CM sheet fetch failed:', e);
    return [];
  }
}

// ─────────────────────────────────────────────
// NP SCHEDULE — keyed by date
// onSite: true/false
// name: display name
// hours: e.g. "9:00 AM – 1:00 PM"
// note: optional note
// ─────────────────────────────────────────────
const DAILY_NP = {
  '2026-06-09': { onSite: true, name: "Briana Childers, PMHNP-BC", hours: "", note: "" },
};

// ─────────────────────────────────────────────
// UTILITIES
// ─────────────────────────────────────────────
function todayKey() { return new Date().toISOString().slice(0,10); }
function previewDay() { const p = new URLSearchParams(location.search).get('day'); return p !== null ? parseInt(p) : null; }
function toMins(t) { const [h,m]=t.split(':').map(Number); return h*60+m; }
function nowMins() { const d=new Date(); return d.getHours()*60+d.getMinutes(); }
function fmt12(t) { const [h,m]=t.split(':').map(Number); return `${h%12||12}:${m.toString().padStart(2,'0')} ${h>=12?'PM':'AM'}`; }
const DAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];

function loadData() {
  const key = todayKey();
  const dow = previewDay() !== null ? previewDay() : new Date().getDay();
  let schedule = WEEKLY[dow] || WEEKLY[1];
  let ua = (DAILY_UA[key] || []).map(i => ({ initials: i }));
  let np = DAILY_NP[key] || { onSite: false, name: "Not scheduled today", hours: "", note: "" };
  return { schedule, ua, cm: [], np };
}

let DATA = loadData();
let SCHEDULE = DATA.schedule;
let UA = DATA.ua;
let CM = DATA.cm;
let NP = DATA.np;

// ─────────────────────────────────────────────
// RENDER
// ─────────────────────────────────────────────
function renderClock() {
  const d = new Date();
  const h=d.getHours()%12||12, m=d.getMinutes().toString().padStart(2,'0');
  document.getElementById('clock').textContent = `${h}:${m} ${d.getHours()>=12?'PM':'AM'}`;
  document.getElementById('datestr').textContent = `${DAYS[d.getDay()]}, ${MONTHS[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`;
}

function getCurrentFor(track) {
  const nm = nowMins();
  const items = SCHEDULE.filter(s => s.track===track||s.track==='all');
  for (let i=0; i<items.length-1; i++) {
    if (nm >= toMins(items[i].time) && nm < toMins(items[i+1].time)) return { current: items[i], next: items[i+1] };
  }
  const last = items[items.length-1];
  if (last && nm >= toMins(last.time)) return { current: last, next: null };
  return { current: null, next: items[0] };
}

function renderNow() {
  const nm = nowMins();
  const sacot = getCurrentFor('sacot');
  const saiop = getCurrentFor('saiop');
  const saiopDone = nm >= toMins('12:15');

  document.getElementById('php-activity').textContent = sacot.current ? sacot.current.label : 'Not started yet';
  document.getElementById('php-location').textContent = sacot.current?.location || '';
  document.getElementById('php-next').textContent = sacot.next ? `Up next: ${sacot.next.label} at ${fmt12(sacot.next.time)}` : '';

  const iopPill = document.getElementById('iop-pill');
  if (saiopDone) {
    iopPill.className = 'track-pill pill-done';
    iopPill.innerHTML = '<span class="pill-dot"></span>SAIOP';
    document.getElementById('iop-activity').textContent = 'Day complete';
    document.getElementById('iop-activity').style.color = 'var(--text-dim)';
    document.getElementById('iop-location').textContent = '';
    document.getElementById('iop-next').textContent = '';
  } else {
    iopPill.className = 'track-pill pill-saiop';
    iopPill.innerHTML = '<span class="pill-dot"></span>SAIOP';
    document.getElementById('iop-activity').textContent = saiop.current ? saiop.current.label : 'Not started yet';
    document.getElementById('iop-activity').style.color = '';
    document.getElementById('iop-location').textContent = saiop.current?.location || '';
    document.getElementById('iop-next').textContent = saiop.next ? `Up next: ${saiop.next.label} at ${fmt12(saiop.next.time)}` : '';
  }
}

function isBreakRow(l) { return l === 'On Break' || l === 'Lunch Break'; }
function isDoneRow(l) { return l.includes('day complete'); }

function renderScheduleFor(track, elId) {
  const nm = nowMins();
  const items = SCHEDULE.filter(s => s.track===track||s.track==='all');
  document.getElementById(elId).innerHTML = items.map((s,i) => {
    const start = toMins(s.time);
    const end = items[i+1] ? toMins(items[i+1].time) : start+90;
    const isActive = nm>=start && nm<end;
    const isPast = nm>=end;
    const extra = isBreakRow(s.label)?'is-break':isDoneRow(s.label)?'is-done':'';
    const cls = `${isActive?'active':isPast?'past':''} ${extra}`.trim();
    return `<div class="sched-row ${cls}">
      <div class="sched-time">${fmt12(s.time)}</div>
      <div class="sched-body">
        <div class="sched-label">${s.label}</div>
        ${s.location?`<div class="sched-location">${s.location}</div>`:''}
      </div>
    </div>`;
  }).join('');
}

function renderSchedule() {
  renderScheduleFor('sacot','sacot-schedule-list');
  renderScheduleFor('saiop','saiop-schedule-list');
}

function renderUA() {
  const el = document.getElementById('ua-list');
  if (!UA.length) {
    el.innerHTML = '<li class="ua-empty">No UA scheduled today.</li>';
    return;
  }
  el.innerHTML = UA.map(u => {
    const raw = u.initials.trim();
    const parts = raw.split(' ').filter(Boolean);
    const inner = parts.length >= 2
      ? `<span>${parts[0]}</span><span>${parts[1]}</span>`
      : `<span>${raw}</span>`;
    return `<li><div class="ua-bubble">${inner}</div></li>`;
  }).join('');
}

function renderCM() {
  const el = document.getElementById('cm-list');
  if (!CM.length) {
    el.innerHTML = '<div class="cm-empty">No appointments entered yet.</div>';
    return;
  }
  el.innerHTML = CM.map(c =>
    `<div class="cm-row">
      <span class="cm-initials">${c.initials}</span>
      ${c.time ? `<span class="cm-time">${c.time}</span>` : ''}
    </div>`
  ).join('');
}

function renderNP() {
  const dot = document.getElementById('np-dot');
  dot.className = 'np-dot ' + (NP.onSite ? 'yes' : 'no');
  document.getElementById('np-label').textContent = NP.onSite ? (NP.name || 'NP on-site today') : 'Not scheduled today';
  document.getElementById('np-label').style.color = NP.onSite ? 'var(--green)' : 'var(--text-dim)';
}

function tick() { renderClock(); renderSchedule(); renderNow(); renderUA(); renderCM(); renderNP(); }
tick();
setInterval(tick, 30000);

// Initial fetches + refresh every 5 minutes
async function refreshCM() {
  CM = await fetchCMFromSheet();
  renderCM();
}

async function refreshUA() {
  const sheetUA = await fetchUAFromSheet();
  if (sheetUA.length > 0) {
    UA = sheetUA;
    renderUA();
  }
}

refreshCM();
refreshUA();
setInterval(refreshCM, 5 * 60 * 1000);
setInterval(refreshUA, 10 * 60 * 1000);
</script>
